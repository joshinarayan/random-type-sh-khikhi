<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ella!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a16; /* Deep navy/black */
            font-family: 'Lato', sans-serif;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass to 3D if needed, but UI buttons need pointer-events: auto */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10vh 0;
            box-sizing: border-box;
        }

        .title-container {
            text-align: center;
            opacity: 0;
            animation: fadeInDown 2s ease forwards;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            margin: 0;
            font-weight: 700;
            background: linear-gradient(to right, #FFD700, #E8A598, #7FFFD4, #FFD700);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .message {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            margin-top: 20px;
            color: #E8A598;
            opacity: 0;
            animation: fadeInUp 2s ease 2s forwards; /* Fades in after 2s */
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(232, 165, 152, 0.5);
        }

        .controls {
            pointer-events: auto;
            opacity: 0;
            animation: fadeInUp 2s ease 3s forwards;
            margin-bottom: 5vh;
        }

        button {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
            font-family: 'Lato', sans-serif;
            font-size: 1.2rem;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: #FFD700;
            color: #030a16;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7), inset 0 0 20px rgba(255, 215, 0, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Vignette overlay */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(3, 10, 22, 0.9) 120%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <div id="ui-layer">
        <div class="title-container">
            <h1>Happy Birthday ella!</h1>
            <div class="message">Wishing you a lifetime of joy . From Vyxo.</div>
        </div>
        
        <div class="controls">
            <button id="blowBtn">Blow the Candles</button>
        </div>
    </div>

    <!-- Need Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Web Audio API Setup ---
        let audioCtx;
        let oscillators = [];
        let gainNode;

        function startAudio() {
            if (audioCtx) return; // Already started
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.05; // Soft volume
            gainNode.connect(audioCtx.destination);
            
            // Frequencies for a lush, euphoric ambient drone (Major 7th synth style)
            const freqs = [220, 277.18, 329.63, 415.30, 110]; // A3, C#4, E4, G#4, A2
            
            freqs.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                
                // Base tone
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                // Slow modulation
                lfo.type = 'sine';
                lfo.frequency.value = 0.1 + Math.random() * 0.2; // Slow LFO
                lfo.connect(lfoGain);
                
                lfoGain.gain.value = 5; // Detune amount
                lfoGain.connect(osc.detune);
                
                osc.connect(gainNode);
                lfo.start();
                osc.start();
                oscillators.push({ osc, lfo, lfoGain });
            });
        }

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030a16, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // performance
        // Tone mapping for premium bloom vibe
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x112233, 1);
        scene.add(ambientLight);

        const fillLight = new THREE.DirectionalLight(0x7FFFD4, 0.5); // Cyan fill
        fillLight.position.set(-10, 10, 10);
        scene.add(fillLight);

        const fillLight2 = new THREE.DirectionalLight(0xE8A598, 0.5); // Rose fill
        fillLight2.position.set(10, 10, -10);
        scene.add(fillLight2);

        // Cake Spotlight
        const cakeSpot = new THREE.SpotLight(0xffffff, 2);
        cakeSpot.position.set(0, 20, 0);
        cakeSpot.angle = Math.PI / 4;
        cakeSpot.penumbra = 0.8;
        cakeSpot.lookAt(0, 0, 0);
        scene.add(cakeSpot);

        // --- Models ---
        // Cake Base
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // Cake Tier 1
        const cakeGeo1 = new THREE.CylinderGeometry(8, 8, 4, 64);
        const cakeMat1 = new THREE.MeshStandardMaterial({ 
            color: 0xffeebb, 
            roughness: 0.6,
            metalness: 0.1
        });
        const cake1 = new THREE.Mesh(cakeGeo1, cakeMat1);
        cake1.position.y = 2;
        cakeGroup.add(cake1);

        // Frosting drip geo trick
        const frostMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1
        });
        const frost1 = new THREE.Mesh(new THREE.CylinderGeometry(8.2, 8.2, 1, 64), frostMat);
        frost1.position.y = 3.6;
        cakeGroup.add(frost1);

        // Cake Tier 2
        const cakeGeo2 = new THREE.CylinderGeometry(6, 6, 4, 64);
        const cake2 = new THREE.Mesh(cakeGeo2, cakeMat1);
        cake2.position.y = 6;
        cakeGroup.add(cake2);

        const frost2 = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 1, 64), frostMat);
        frost2.position.y = 7.6;
        cakeGroup.add(frost2);

        // Cake floating animation base
        cakeGroup.position.y = -2;

        // --- Candles ---
        const candles = [];
        const flames = [];
        const flameLights = [];
        
        function createCandle(x, y, z) {
            const candleGroup = new THREE.Group();
            
            // Candle body
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xE8A598, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            candleGroup.add(body);

            // Wick
            const wickGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const wickMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const wick = new THREE.Mesh(wickGeo, wickMat);
            wick.position.y = 3.25;
            candleGroup.add(wick);

            // Flame
            const flameGeo = new THREE.SphereGeometry(0.3, 16, 16);
            // Squish flame to look like a teardrop
            flameGeo.scale(1, 2, 1);
            const flameMat = new THREE.MeshBasicMaterial({ 
                color: 0xFFD700, 
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.position.y = 4;
            candleGroup.add(flame);
            flames.push({mesh: flame, baseScale: 1});

            // Flame Light (glow)
            const flameLight = new THREE.PointLight(0xFFD700, 1.5, 15);
            flameLight.position.y = 4;
            candleGroup.add(flameLight);
            flameLights.push(flameLight);

            candleGroup.position.set(x, y, z);
            cakeGroup.add(candleGroup);
            candles.push(candleGroup);
        }

        // Add candles in a circle
        for(let i=0; i<6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const r = 4;
            createCandle(Math.cos(angle)*r, 8.1, Math.sin(angle)*r);
        }
        // Center candle
        createCandle(0, 8.1, 0);

        // --- Orbiting Gifts ---
        const gifts = [];
        const giftGeo = new THREE.BoxGeometry(2, 2, 2);
        const giftMats = [
            new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.6, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0xE8A598, metalness: 0.6, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0x7FFFD4, metalness: 0.6, roughness: 0.2 }),
        ];

        for(let i=0; i<5; i++) {
            const gift = new THREE.Mesh(giftGeo, giftMats[i % giftMats.length]);
            // Give each gift random rotation speed/offsets
            gifts.push({
                mesh: gift,
                angle: (i / 5) * Math.PI * 2,
                orbitSpeed: 0.5 + Math.random() * 0.5,
                radius: 15 + Math.random() * 5,
                height: -5 + Math.random() * 15,
                rotY: Math.random() * 0.05,
                rotX: Math.random() * 0.05
            });
            scene.add(gift);
        }

        // --- Particles (Ambient Confetti) ---
        const particleCount = 2000;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        
        const colorPalette = [
            new THREE.Color(0xFFD700), // Gold
            new THREE.Color(0xE8A598), // Rose
            new THREE.Color(0x7FFFD4), // Cyan
            new THREE.Color(0xffffff)  // White
        ];

        for(let i=0; i<particleCount; i++) {
            // Spawn around a large cylinder area
            const r = 5 + Math.random() * 40;
            const theta = Math.random() * Math.PI * 2;
            positions[i*3] = r * Math.cos(theta);
            positions[i*3+1] = -20 + Math.random() * 60; // Y
            positions[i*3+2] = r * Math.sin(theta);
            
            const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i*3] = c.r;
            colors[i*3+1] = c.g;
            colors[i*3+2] = c.b;
            
            sizes[i] = Math.random() * 0.5 + 0.1;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particlesGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Create a circular texture code for particles
        function createCircleTex() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(8, 8, 8, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        const parMaterial = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            map: createCircleTex(),
            transparent: true,
            opacity: 0.8,
            alphaTest: 0.1
        });

        const particlesMesh = new THREE.Points(particlesGeo, parMaterial);
        scene.add(particlesMesh);

        // --- Explosive Confetti (Fireworks) Setup ---
        let explosionActive = false;
        const explosionParticles = [];

        function triggerExplosion() {
            // Blow candles out
            flames.forEach(f => f.mesh.visible = false);
            flameLights.forEach(l => l.intensity = 0);
            
            // Audio flair
            if(gainNode) {
                // fade out drone
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 2);
            }
            
            // Create burst particles
            const popCount = 1000;
            const popGeo = new THREE.BufferGeometry();
            const popPos = new Float32Array(popCount * 3);
            const popColors = new Float32Array(popCount * 3);
            const popVelocities = [];

            for(let i=0; i<popCount; i++) {
                // start at candle center ish
                popPos[i*3] = 0;
                popPos[i*3+1] = 12; // top of cake
                popPos[i*3+2] = 0;
                
                const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                popColors[i*3] = c.r;
                popColors[i*3+1] = c.g;
                popColors[i*3+2] = c.b;

                // Spherical random velocity
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = 0.5 + Math.random() * 1.5;
                
                popVelocities.push({
                    vx: Math.sin(phi) * Math.cos(theta) * speed,
                    vy: Math.abs(Math.cos(phi)) * speed * 1.5 + 0.5, // emphasize upward
                    vz: Math.sin(phi) * Math.sin(theta) * speed,
                    life: 1.0 // 1.0 down to 0
                });
            }

            popGeo.setAttribute('position', new THREE.BufferAttribute(popPos, 3));
            popGeo.setAttribute('color', new THREE.BufferAttribute(popColors, 3));

            const popMat = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                map: createCircleTex(),
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            const explosion = new THREE.Points(popGeo, popMat);
            scene.add(explosion);
            
            explosionActive = true;
            explosionParticles.push({
                mesh: explosion,
                vels: popVelocities,
                geo: popGeo
            });

            // Make background lighting brighter
            fillLight.intensity = 1.5;
            fillLight2.intensity = 1.5;

            document.getElementById('blowBtn').style.display = 'none';

            // Add dynamic fireworks
            setInterval(() => spawnFirework(), 400);
        }

        function spawnFirework() {
            const px = (Math.random() - 0.5) * 40;
            const py = 10 + Math.random() * 20;
            const pz = (Math.random() - 0.5) * -40 - 10;
            
            const fwCount = 200;
            const fwGeo = new THREE.BufferGeometry();
            const fwPos = new Float32Array(fwCount * 3);
            const fwCol = new Float32Array(fwCount * 3);
            const fwVel = [];

            const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];

            for(let i=0; i<fwCount; i++) {
                fwPos[i*3] = px;
                fwPos[i*3+1] = py;
                fwPos[i*3+2] = pz;
                
                fwCol[i*3] = c.r;
                fwCol[i*3+1] = c.g;
                fwCol[i*3+2] = c.b;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = 0.2 + Math.random() * 0.5;

                fwVel.push({
                    vx: Math.sin(phi) * Math.cos(theta) * speed,
                    vy: Math.cos(phi) * speed,
                    vz: Math.sin(phi) * Math.sin(theta) * speed,
                    life: 1.0
                });
            }
            fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
            fwGeo.setAttribute('color', new THREE.BufferAttribute(fwCol, 3));

            const fwMat = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                map: createCircleTex(),
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            const fw = new THREE.Points(fwGeo, fwMat);
            scene.add(fw);
            explosionParticles.push({ mesh: fw, vels: fwVel, geo: fwGeo });
        }

        document.getElementById('blowBtn').addEventListener('click', () => {
            startAudio();
            triggerExplosion();
        });

        // Initialize audio on first click anywhere in case they don't click the button
        document.body.addEventListener('click', () => {
            if(!explosionActive) {
                startAudio();
            }
        }, {once: true});


        // --- Animation Loop ---
        const clock = new THREE.Clock();
        
        // Target camera parameters for smooth orbit
        let camAngle = 0;
        let camRadius = 35;
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Camera Orbit
            camAngle += delta * 0.15; // Slow orbit
            
            // Subtle breathing effect on radius
            const currentRadius = camRadius + Math.sin(time * 0.5) * 5;
            
            // Calculate target position
            const targetX = Math.cos(camAngle) * currentRadius;
            const targetZ = Math.sin(camAngle) * currentRadius;
            
            // Lerp camera position for smoothness
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.z += (targetZ - camera.position.z) * 0.05;
            camera.position.y = 12 + Math.sin(time) * 3;
            camera.lookAt(0, 5, 0);

            // Cake floating bob
            cakeGroup.position.y = -2 + Math.sin(time * 1.5) * 0.5;
            cakeGroup.rotation.y = time * 0.2;

            // Candles flicker
            if(!explosionActive) {
                flames.forEach((f, i) => {
                    // Random scale flutter
                    const flutter = 1.0 + (Math.random() * 0.2 - 0.1);
                    f.mesh.scale.set(flutter, flutter*1.2, flutter); // Keep it tear dropped
                    
                    // Light flicker
                    flameLights[i].intensity = 1.2 + Math.random() * 0.6;
                });
            }

            // Orbiting Gifts
            gifts.forEach(g => {
                g.angle += delta * g.orbitSpeed;
                g.mesh.position.x = Math.cos(g.angle) * g.radius;
                g.mesh.position.z = Math.sin(g.angle) * g.radius;
                g.mesh.position.y = g.height + Math.sin(time * 2 + g.angle) * 3;
                
                g.mesh.rotation.x += g.rotX;
                g.mesh.rotation.y += g.rotY;
            });

            // Ambient Particles Rise
            const posAttr = particlesMesh.geometry.attributes.position;
            const posArray = posAttr.array;
            for(let i=0; i<particleCount; i++) {
                posArray[i*3+1] += delta * 2; // Move up
                // Swirl
                posArray[i*3] += Math.sin(time + i) * 0.01;
                posArray[i*3+2] += Math.cos(time + i) * 0.01;

                // Reset height
                if(posArray[i*3+1] > 40) {
                    posArray[i*3+1] = -20;
                }
            }
            posAttr.needsUpdate = true;

            // Explosion Particles Dynamics
            for(let k=explosionParticles.length-1; k>=0; k--) {
                const ep = explosionParticles[k];
                const pPosAttr = ep.geo.attributes.position;
                const pArray = pPosAttr.array;
                
                let alive = false;
                for(let i=0; i<ep.vels.length; i++) {
                    const v = ep.vels[i];
                    if(v.life > 0) {
                        alive = true;
                        // Apply gravity
                        v.vy -= delta * 1.5;
                        
                        // Apply velocity
                        pArray[i*3] += v.vx;
                        pArray[i*3+1] += v.vy;
                        pArray[i*3+2] += v.vz;
                        
                        // Decay life
                        v.life -= delta * 0.5;
                        // Shrink velocity a bit (drag)
                        v.vx *= 0.98;
                        v.vz *= 0.98;
                    } else {
                        // Move dead particles far away
                        pArray[i*3+1] = -9999;
                    }
                }
                
                pPosAttr.needsUpdate = true;
                if(ep.mesh.material.opacity > 0) {
                    ep.mesh.material.opacity -= delta * 0.2; // Fade entire group slowly
                }
                
                // Cleanup dead systems (optional, keeping it simple here)
                if(!alive && ep.mesh.material.opacity <= 0) {
                    scene.remove(ep.mesh);
                    explosionParticles.splice(k, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
